# .github/workflows/daily_pipeline.yml
#
# Daily Pipeline Orchestrator â€” bd-mfs-fraud-analytics
#
# Schedule: Every day at 02:00 UTC (08:00 AM Bangladesh time)
# Manual  : Go to Actions tab â†’ "Daily Fraud Pipeline" â†’ "Run workflow"
#
# Required GitHub Secrets (Settings â†’ Secrets â†’ Actions â†’ New repository secret):
#   DB_HOST      â€” PostgreSQL host (e.g., your-cloud-db.host.com OR localhost)
#   DB_PORT      â€” PostgreSQL port (default: 5432)
#   DB_NAME      â€” Database name  (e.g., mfs_fraud)
#   DB_USER      â€” Database user  (e.g., mfs_user)
#   DB_PASSWORD  â€” Database password
#
# NOTE: This workflow is designed for a CLOUD PostgreSQL database (e.g., Supabase,
#       Railway, Neon, or any managed PG). For local PostgreSQL, use the
#       manual trigger only or set up a tunnel (e.g., ngrok).
#       DO NOT commit real credentials â€” use secrets only.

name: Daily Fraud Pipeline

on:
  # â”€â”€ Scheduled trigger: every day at 02:00 UTC â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  schedule:
    - cron: "0 2 * * *"

  # â”€â”€ Manual trigger from GitHub Actions UI â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  workflow_dispatch:
    inputs:
      steps:
        description: "Pipeline steps to run (space-separated)"
        required: false
        default: "generate load quality score report"
      rows:
        description: "Number of synthetic rows to generate"
        required: false
        default: "500"

# â”€â”€ Permissions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
permissions:
  contents: read

jobs:
  run-pipeline:
    name: "Run Daily Fraud Detection Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # â”€â”€ 1. Checkout code â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Checkout repository
        uses: actions/checkout@v4

      # â”€â”€ 2. Set up Python 3.11 â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # â”€â”€ 3. Install dependencies â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # package build not needed

      # â”€â”€ 4. Write .env from GitHub Secrets â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      #      Secrets are never echoed to logs by GitHub Actions.
      - name: Configure environment
        run: |
          cat > .env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF
        # .env is created in runner temp storage only â€” not committed

      # â”€â”€ 5. Validate imports (dry-run) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Dry-run validation
        run: |
          python -m scripts.run_pipeline --dry-run

      # â”€â”€ 6. Run the full pipeline â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Run pipeline
        run: |
          STEPS="${{ github.event.inputs.steps || 'generate load quality score report' }}"
          ROWS="${{ github.event.inputs.rows || '500' }}"
          python -m scripts.run_pipeline --steps $STEPS --rows $ROWS

      # â”€â”€ 7. Upload logs as artifact â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Upload pipeline logs
        if: always()  # upload even if pipeline failed
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30

      # â”€â”€ 8. Post failure notice to GitHub Step Summary â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Write job summary
        if: always()
        run: |
          echo "## Pipeline Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp (UTC) | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "| Steps | ${{ github.event.inputs.steps || 'all' }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/*.log ]; then
            echo "### Last 20 log lines" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 logs/*.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi




