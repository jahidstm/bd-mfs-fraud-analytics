[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bd-mfs-fraud-analytics"
version = "0.1.0"
description = "Bangladesh MFS Fraud Detection & Monitoring Dashboard"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "faker>=26.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "imbalanced-learn>=0.12",
    "requests>=2.31",
    "reportlab>=4.2",
    "matplotlib>=3.9",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
